server:
  port: 8080

spring:
  application:
    name: hfuu-thesis-auth

  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/hfuu_thesis?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  # 邮件配置
  mail:
    host: smtp.qq.com
    username: your-email@qq.com
    password: your-email-password
    port: 465
    protocol: smtps
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true
            required: true

  # Redis配置 - 可选
  redis:
    host: localhost
    port: 6379
    timeout: 500ms
    database: 0
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0
    connect-timeout: 500ms



# JWT配置
jwt:
  secret: your-jwt-secret-key-change-in-production
  expiration: 3600000

# 日志配置
logging:
  level:
    com.hfuu: debug
    org.springframework.security: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/app.log
    max-size: 10MB
    max-history: 30
